# Workflow to update data.json when layouts or languages change
name: Update Layout Data

on:
  push:
    branches: ["main"]
    paths:
      - 'config/layouts/*.yml'
      - 'config/languages.yml'
  workflow_dispatch:

permissions:
  contents: write

# Two scrapes must never overlap: both rewrite site/data.json and then race to
# push it.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Start from the tip of the branch: an earlier run may have pushed a
          # data.json commit while this one sat in the queue, and scraping on
          # top of a stale tree is what makes the push below conflict.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Detect changed layout files
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Diff the range this push covers. HEAD is the branch tip, which can
          # already be ahead of this run's commit, so HEAD~1..HEAD would look at
          # somebody else's change.
          CHANGED=""
          LANGUAGES_CHANGED=""
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only --diff-filter=ACMR "$BEFORE" "$AFTER" -- 'config/layouts/*.yml' | sed 's|config/layouts/||; s|\.yml$||' || true)
            LANGUAGES_CHANGED=$(git diff --name-only --diff-filter=ACMR "$BEFORE" "$AFTER" -- 'config/languages.yml' || true)
          else
            echo "No push range to diff (manual run, or a force push dropped the previous commit)"
          fi

          if [ -n "$LANGUAGES_CHANGED" ]; then
            echo "languages_changed=true" >> $GITHUB_OUTPUT
            echo "layout_names=" >> $GITHUB_OUTPUT
            echo "Languages config changed — will do full scrape"
          elif [ -n "$CHANGED" ]; then
            echo "languages_changed=false" >> $GITHUB_OUTPUT
            # Convert newlines to spaces for the --layouts flag
            NAMES=$(echo "$CHANGED" | tr '\n' ' ')
            echo "layout_names=$NAMES" >> $GITHUB_OUTPUT
            echo "Changed layouts: $NAMES"
          else
            echo "languages_changed=false" >> $GITHUB_OUTPUT
            echo "layout_names=" >> $GITHUB_OUTPUT
            echo "No layout changes detected"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Playwright browsers
        run: uv run playwright install chromium

      - name: Run scrape script
        run: |
          if [ "${{ steps.changed.outputs.languages_changed }}" = "true" ]; then
            echo "Languages changed — running full refresh"
            uv run scripts/scrape_stats.py --full-refresh
          elif [ -n "${{ steps.changed.outputs.layout_names }}" ]; then
            echo "Scraping changed layouts: ${{ steps.changed.outputs.layout_names }}"
            uv run scripts/scrape_stats.py --layouts ${{ steps.changed.outputs.layout_names }}
          else
            echo "Running default scrape (update missing/invalid)"
            uv run scripts/scrape_stats.py
          fi

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet site/data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # If the branch moved under us, replay the file we just generated onto
          # the new tip instead of rebasing. site/data.json is derived from
          # config/ plus the scrape, and a rebase conflicts on every metric that
          # both sides touched -- including the scraped_at line, every time.
          for attempt in 1 2 3; do
            git add site/data.json
            git diff --cached --quiet || \
              git commit -m "chore: update data.json with latest layout statistics"

            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi

            echo "Push rejected (attempt $attempt) - replaying data.json onto the updated branch"
            cp site/data.json "$RUNNER_TEMP/data.json"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            cp "$RUNNER_TEMP/data.json" site/data.json
          done

          echo "::error::Could not push site/data.json after 3 attempts"
          exit 1

  deploy:
    needs: update-data
    if: always() && needs.update-data.result == 'success'
    uses: ./.github/workflows/deploy_website.yml
    permissions:
      contents: read
      pages: write
      id-token: write

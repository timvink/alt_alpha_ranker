name: Tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install npm dependencies
        run: npm ci

      - name: Run JS tests (jest)
        run: npm test

      - name: Run JS standalone tests
        run: node site/layout-scores.standalone-test.mjs

      - name: Run Python unit tests
        run: uv run pytest scripts/test_scrape_stats.py -m "not integration"
